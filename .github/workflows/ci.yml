name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm mac:drag-bridge
      - run: pnpm check
      - run: pnpm build
      - run: cargo test --lib
        working-directory: src-tauri
      - run: pnpm tauri build --target universal-apple-darwin --debug --bundles app
        env:
          RUSTUP_TOOLCHAIN: stable

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: cargo check
        working-directory: src-tauri
      - run: pnpm tauri build --debug --no-bundle
